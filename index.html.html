['M40 92 C190 18 540 14 762 82 S792 428 704 492 S204 512 60 436 S8 170 40 92','M150 175 Q250 90 340 105 T660 130','M340 105 Q470 190 560 330','M150 175 Q330 300 560 330','M660 130 Q650 240 560 330','M560 330 L700 400'].forEach(function(d){nd('path',{d:d,class:'rl','stroke-width':8},map);nd('path',{d:d,class:'rd','stroke-width':5},map)});

else if(S.mt==='rep'){var mk=Math.max.apply(null,emps.map(function(e){return e.km}))||1,csv='name,role,km,hours,jobs_done\n'+emps.map(function(e){return[e.n,e.role,e.km.toFixed(1),hrs(e).toFixed(2),e.done].join(',')}).join('\n');
var op=JOBS.filter(function(j){return!j.done&&!j.by}).length,as=JOBS.filter(function(j){return!j.done&&j.by}).length,dn=JOBS.filter(function(j){return j.done}).length;
$('#v-rep').innerHTML='<div class="two"><div><h2 class="label">Distance by staff</h2>'+emps.map(function(e){return'<div class="br"><span>'+esc(e.n.split(' ')[0])+'</span><div class="tr"><div class="fl" style="width:'+(e.km/mk*100)+'%"></div></div><span class="num">'+e.km.toFixed(1)+'</span></div>'}).join('')+'</div><div><h2 class="label">Jobs</h2><div class="kpis"><div class="kpi"><b>'+op+'</b><span class="sm">Open</span></div><div class="kpi"><b>'+as+'</b><span class="sm">Assigned</span></div><div class="kpi"><b>'+dn+'</b><span class="sm">Completed</span></div></div><h2 class="label">CSV (copy to export)</h2><textarea readonly style="width:100%;min-height:130px;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)" class="mono">'+csv+'</textarea></div></div>'}}
/* employee */
function renderEmp(){var e=ME,o=on(e),j=e.job&&jb(e.job);$('#emp').innerHTML='<div class="phone"><div class="panel pad row"><span class="av">'+ini(e.n)+'</span><div><h3 class="name">'+esc(e.n)+'</h3><div class="sm"><i class="dot '+e.st+'"></i> '+(o?'On shift · '+hm(hrs(e)):'Off shift · next '+e.sched)+'</div></div></div>'+
'<div class="panel pad"><h2 class="label">'+(o?'Current task':'Next shift')+'</h2>'+(j?'<div class="state"><b>'+esc(j.t)+'</b><div class="sm">'+SITES[j.s].n+'</div><button class="btn full" data-act="mydone">Mark job completed</button></div>':'<div class="sm">No active job assigned. Wait for dispatch.</div>')+'<button class="btn'+(o?' danger':'')+' full" data-act="'+(o?'cout':'cin')+'" style="padding:12px">'+(o?'Clock out':'Clock in')+'</button></div>'+
'<div class="panel pad sw"><div><b>Location sharing</b><div class="sm">Only visible during your shift</div></div><button role="switch" aria-label="Location sharing" aria-checked="'+e.consent+'" data-act="cons"></button></div></div>'}
/* actions */
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-act],.mk,.jm');if(!t)return;var a=t.dataset.act,v=t.dataset.v;
if(t.classList.contains('mk'))a='sel',v=t.dataset.id;else if(t.classList.contains('jm'))a='job',v=t.dataset.job;
if(a==='role'){S.role=v;document.querySelectorAll('[data-act=role]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v))});$('#mgr').hidden=v!=='mgr';$('#emp').hidden=v!=='emp';if(v==='emp')renderEmp()}
else if(a==='mt'){S.mt=v;document.querySelectorAll('[data-act=mt]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v))});$('#v-live').hidden=v!=='live';$('#v-att').hidden=v!=='att';$('#v-rep').hidden=v!=='rep';renderTab()}
else if(a==='sel'){S.sel=v;S.job=null;renderDetail();renderRoster();drawMap()}
else if(a==='job'){S.job=v;S.sel=null;renderDetail();renderRoster();drawMap()}
else if(a==='assign'){var j=jb(S.job),e=by(v);if(j.by&&by(j.by))by(j.by).job=null;if(e.job&&jb(e.job)&&e.job!==j.id)jb(e.job).by=null;j.by=v;e.job=j.id;alertP(j.t+' assigned to '+e.n);save();renderDetail();renderRoster();drawMap()}
else if(a==='force'){finish(jb(v));renderDetail();renderRoster();drawMap()}
else if(a==='del'){var d=jb(v);if(d.by)by(d.by).job=null;JOBS=JOBS.filter(function(x){return x.id!==v});S.job=null;save();renderDetail();renderRoster();drawMap()}
else if(a==='add'){var ti=$('#nj-t').value.trim(),sk=$('#nj-s').value;if(!ti){toast('Enter a job title');return}var s=SITES[sk];JOBS.push({id:'j'+(++seq),t:ti,s:sk,x:s.x+(Math.random()*40-20),y:s.y+(Math.random()*40-20),by:null,done:false});alertP('New job: '+ti);save();renderDetail();renderRoster();drawMap()}
else if(a==='cin'){ME.st='active';ME.since=Date.now();var n=new Date();ME.cin=p2(n.getHours())+':'+p2(n.getMinutes());ME.x=SITES.C.x;ME.y=SITES.C.y;ME.leg=1;alertP(ME.n+' clocked in');save();renderEmp();drawMap();renderRoster()}
else if(a==='cout'){ME.base=hrs(ME);ME.st='offline';ME.since=null;alertP(ME.n+' clocked out');save();renderEmp();drawMap();renderRoster()}
else if(a==='cons'){ME.consent=!ME.consent;save();renderEmp();chip();drawMap()}
else if(a==='mydone'){var mj=jb(ME.job);if(mj)finish(mj);renderEmp();drawMap();renderRoster()}});
load();build();renderRoster();renderDetail();alertP('Dispatch console ready');drawMap();chip();setInterval(tick,1500);
})();
</script></body></html>
